<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Interactive client-side To-Do List application using JavaScript DOM manipulation and localStorage."
    >

    <title>Task Manager | JavaScript To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app-container">

        <section
            class="todo-app"
            aria-labelledby="app-title"
        >

            <header class="app-header">

                <p class="eyebrow">
                    JavaScript Task 03
                </p>

                <h1 id="app-title">
                    My To-Do List
                </h1>

                <p class="subtitle">
                    Organize your tasks and track your progress.
                </p>

            </header>


            <!-- Add Task -->

            <form
                id="todo-form"
                class="todo-form"
            >

                <label
                    for="todo-input"
                    class="sr-only"
                >
                    Enter a new task
                </label>

                <input
                    type="text"
                    id="todo-input"
                    name="todo"
                    placeholder="Enter a new task..."
                    autocomplete="off"
                    maxlength="150"
                    required
                >

                <button
                    type="submit"
                    class="add-button"
                >
                    Add Task
                </button>

            </form>


            <!-- Filters -->

            <nav
                class="filters"
                aria-label="Task filters"
            >

                <button
                    type="button"
                    class="filter-button active"
                    data-filter="all"
                    aria-pressed="true"
                >
                    All
                    <span id="all-count">0</span>
                </button>

                <button
                    type="button"
                    class="filter-button"
                    data-filter="active"
                    aria-pressed="false"
                >
                    Active
                    <span id="active-count">0</span>
                </button>

                <button
                    type="button"
                    class="filter-button"
                    data-filter="completed"
                    aria-pressed="false"
                >
                    Completed
                    <span id="completed-count">0</span>
                </button>

            </nav>


            <!-- Task List -->

            <section
                aria-labelledby="task-list-heading"
                class="task-section"
            >

                <h2
                    id="task-list-heading"
                    class="sr-only"
                >
                    Tasks
                </h2>

                <ul
                    id="todo-list"
                    class="todo-list"
                    aria-live="polite"
                ></ul>

                <p
                    id="empty-state"
                    class="empty-state"
                >
                    No tasks yet. Add your first task.
                </p>

            </section>


            <!-- Status -->

            <p
                id="status-message"
                class="status-message"
                aria-live="polite"
            ></p>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
